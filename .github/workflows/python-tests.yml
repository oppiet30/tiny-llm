name: Python checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q train.py benchmark_upload.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: tiny_llm_benchmarks
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TINY_LLM_TEST_DB_HOST: 127.0.0.1
      TINY_LLM_TEST_DB_PORT: 3306
      TINY_LLM_TEST_DB_USER: root
      TINY_LLM_TEST_DB_PASSWORD: ci-root-password
      TINY_LLM_TEST_DB_NAME: tiny_llm_benchmarks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "PyMySQL>=1.1,<2.0"
      - name: Initialize disposable test schema
        run: mariadb -h 127.0.0.1 -uroot -pci-root-password tiny_llm_benchmarks < tests/fixtures/mariadb-schema.sql
      - name: Apply upload ID migration
        run: mariadb -h 127.0.0.1 -uroot -pci-root-password tiny_llm_benchmarks < database/migrations/001_add_upload_id.sql
      - name: Run real MariaDB integration tests
        run: python -m unittest tests.test_mariadb_integration -v
